<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAR 帧序列测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
  h2 { color: #fff; margin: 20px 0 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
  pre { white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; background: #1a1a1a; padding: 10px; border-radius: 4px; font-size: 12px; }
  .error { color: #f44; }
  .warn { color: #fa0; }
  .ok { color: #0f0; }
  #canvas-wrap { width: 600px; height: 400px; border: 2px solid #0f0; margin: 20px 0; position: relative; }
  button { padding: 8px 16px; margin: 5px; cursor: pointer; }
  .section { margin-bottom: 20px; }
</style>
</head>
<body>

<h1>FrameSequence TAR 诊断</h1>

<div class="section">
  <h2>1. TAR 文件信息</h2>
  <p>TAR URL: <a id="tar-url" href="#" target="_blank" style="color:#0ff;"></a></p>
  <p>文件大小: <span id="tar-size"></span></p>
  <p>状态: <span id="tar-status"></span></p>
</div>

<div class="section">
  <h2>2. TAR 内部文件列表（手动解析，前 100 条）</h2>
  <pre id="tar-files"></pre>
  <p>总条目数: <span id="tar-total"></span></p>
  <p>JPG 文件数: <span id="tar-jpg-count"></span></p>
  <p>匹配 'customize/frame1.jpg' 的条目: <span id="tar-match"></span></p>
  <p>匹配 'frame1.jpg' (无目录前缀) 的条目: <span id="tar-match-bare"></span></p>
</div>

<div class="section">
  <h2>3. FastImageSequence 测试</h2>
  <button onclick="testFIS()">用 TAR 模式加载（含目录前缀）</button>
  <button onclick="testFIS_NoDir()">用 TAR 模式加载（不含目录前缀）</button>
  <button onclick="testManual()">手动用 Tarball 提取 frame1</button>
  <div id="canvas-wrap"><div id="fis-container" style="width:100%;height:100%;"></div></div>
  <pre id="fis-log"></pre>
</div>

<script>
// ==================== 全局状态 ====================
const TAR_URL = 'https://img.cloudcode.ink/api/uploads/file/default/frame/customize.tar';
let tarBuffer = null;

// ==================== 日志工具 ====================
const logEl = document.getElementById('fis-log');
function log(msg, cls = '') {
  const time = new Date().toLocaleTimeString();
  logEl.innerHTML += `<span class="${cls}">[${time}] ${msg}</span>\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

// ==================== TAR 手动解析（标准 POSIX tar）====================
function parseTarHeader(buffer, offset) {
  const view = new Uint8Array(buffer, offset, 512);
  // 读取文件名（前 100 字节，null 结尾）
  const nameEnd = view.indexOf(0, 0);
  const name = new TextDecoder().decode(view.slice(0, nameEnd > 0 ? nameEnd : 100));
  if (name.length === 0) return null; // 结束标记

  // 读取文件大小（offset 124，12 字节，八进制）
  const sizeView = view.slice(124, 136);
  let sizeStr = '';
  for (let i = 0; i < 11; i++) {
    const ch = sizeView[i];
    if (ch === 0 || ch === 32) break;
    sizeStr += String.fromCharCode(ch);
  }
  const size = parseInt(sizeStr, 8) || 0;

  // 读取 typeflag（offset 156）
  const typeflag = String.fromCharCode(view[156]);

  return { name, size, typeflag, headerOffset: offset };
}

function listTarFiles(buffer) {
  const entries = [];
  let offset = 0;
  while (offset < buffer.byteLength - 512) {
    const entry = parseTarHeader(buffer, offset);
    if (!entry) break;
    entries.push(entry);
    // 跳过 header(512) + data(向上取整到 512 的倍数)
    offset += 512 + 512 * Math.ceil(entry.size / 512);
  }
  return entries;
}

// ==================== 步骤1：下载并解析 TAR ====================
async function downloadAndParse() {
  document.getElementById('tar-url').textContent = TAR_URL;
  document.getElementById('tar-url').href = TAR_URL;
  document.getElementById('tar-status').textContent = '下载中...';
  document.getElementById('tar-status').className = 'warn';

  try {
    const resp = await fetch(TAR_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    let rawBuffer = await resp.arrayBuffer();

    // 检测 gzip 魔数 (1f 8b 08)
    const header = new Uint8Array(rawBuffer.slice(0, 3));
    const isGzip = header[0] === 0x1f && header[1] === 0x8b && header[2] === 0x08;
    log(`文件头: 0x${header[0].toString(16)} 0x${header[1].toString(16)} 0x${header[2].toString(16)} ${isGzip ? '(gzip 压缩!)' : '(未压缩)'}`, isGzip ? 'warn' : 'ok');

    if (isGzip) {
      log('正在解压 gzip...', 'warn');
      try {
        const ds = new DecompressionStream('gzip');
        const writer = ds.writable.getWriter();
        writer.write(rawBuffer);
        writer.close();
        rawBuffer = await new Response(ds.readable).arrayBuffer();
        log(`解压成功！解压后大小: ${(rawBuffer.byteLength / 1024 / 1024).toFixed(2)} MB`, 'ok');
      } catch (e) {
        log(`gzip 解压失败: ${e.message}`, 'error');
      }
    }

    tarBuffer = rawBuffer;

    document.getElementById('tar-size').textContent = `${(tarBuffer.byteLength / 1024 / 1024).toFixed(2)} MB`;
    document.getElementById('tar-status').textContent = '下载成功';
    document.getElementById('tar-status').className = 'ok';

    log(`TAR 下载成功，${(tarBuffer.byteLength / 1024 / 1024).toFixed(2)} MB`, 'ok');

    // 解析 TAR
    const entries = listTarFiles(tarBuffer);
    const jpgs = entries.filter(e => e.name.endsWith('.jpg'));
    const match1 = entries.filter(e => e.name.includes('customize/frame1.jpg'));
    const matchBare = entries.filter(e => e.name === 'frame1.jpg');

    document.getElementById('tar-total').textContent = entries.length;
    document.getElementById('tar-jpg-count').textContent = jpgs.length;
    document.getElementById('tar-match').textContent = match1.length > 0 ? `找到 ${match1.length} 条` : '未找到！';
    document.getElementById('tar-match').className = match1.length > 0 ? 'ok' : 'error';
    document.getElementById('tar-match-bare').textContent = matchBare.length > 0 ? `找到 ${matchBare.length} 条` : '未找到！';
    document.getElementById('tar-match-bare').className = matchBare.length > 0 ? 'ok' : 'warn';

    // 显示文件列表
    const fileList = entries.slice(0, 100).map(e => `${e.name} (${e.size} bytes, type=${e.typeflag || 'file'})`).join('\n');
    document.getElementById('tar-files').textContent = fileList;

    // 打印前几个 frame 文件
    log(`TAR 解析完成：${entries.length} 个条目，${jpgs.length} 个 JPG`, 'ok');
    log(`前 5 个 JPG: ${jpgs.slice(0, 5).map(j => j.name).join(', ')}`);
    log(`后 5 个 JPG: ${jpgs.slice(-5).map(j => j.name).join(', ')}`);
    log(`frame1.jpg 精确匹配: ${matchBare.map(j => j.name).join(', ') || 'NONE'}`, matchBare.length > 0 ? 'ok' : 'warn');
    log(`customize/frame1.jpg 包含匹配: ${match1.map(j => j.name).join(', ') || 'NONE'}`, match1.length > 0 ? 'ok' : 'error');

    // 检查 frame 编号范围
    const frameNums = jpgs.map(j => {
      const m = j.name.match(/frame(\d+)\.jpg$/);
      return m ? parseInt(m[1]) : null;
    }).filter(n => n !== null);
    if (frameNums.length > 0) {
      log(`帧编号范围: ${Math.min(...frameNums)} - ${Math.max(...frameNums)}`, 'ok');
    }
  } catch (err) {
    document.getElementById('tar-status').textContent = `下载失败: ${err.message}`;
    document.getElementById('tar-status').className = 'error';
    log(`下载失败: ${err.message}`, 'error');
  }
}

// ==================== 辅助：手动构建 Tarball（用库的内部类）====================
// 由于库的 Tarball 类不直接暴露，我们用 fetch + XHR 模拟
function createTarballFromBuffer(buffer) {
  return {
    fileInfo: [],
    buffer: buffer,
    init() {
      const entries = listTarFiles(buffer);
      this.fileInfo = entries.map(e => ({
        name: e.name,
        size: e.size,
        header_offset: e.headerOffset
      }));
    },
    getInfo(fileName) {
      return this.fileInfo.find(f => f.name.includes(fileName));
    },
    getBlob(fileName) {
      const info = this.getInfo(fileName);
      if (!info) return undefined;
      const data = new Uint8Array(buffer, info.header_offset + 512, info.size);
      return new Blob([data], { type: 'image/jpeg' });
    }
  };
}

// ==================== 步骤3a：FastImageSequence TAR 模式（目录前缀）====================
async function testFIS() {
  const container = document.getElementById('fis-container');
  container.innerHTML = '';
  logEl.textContent = '';

  if (!tarBuffer) {
    log('请等待 TAR 下载完成', 'error');
    return;
  }

  log('创建 FastImageSequence（TAR + 目录前缀）...');

  try {
    const seq = new window['fast-image-sequence'].FastImageSequence(container, {
      frames: 71,
      src: {
        tarURL: TAR_URL,
        imageURL: (i) => `customize/frame${i + 1}.jpg`,
      },
      loop: true,
      objectFit: 'contain',
      showDebugInfo: true,
      clearCanvas: true,
    });

    log('等待 seq.ready...');
    await seq.ready;
    log('FastImageSequence 就绪！播放中...', 'ok');
    seq.progress = 0.5;
  } catch (err) {
    log(`FIS 错误: ${err.message}`, 'error');
    console.error(err);
  }
}

// ==================== 步骤3b：FastImageSequence TAR 模式（无目录前缀）====================
async function testFIS_NoDir() {
  const container = document.getElementById('fis-container');
  container.innerHTML = '';
  logEl.textContent = '';

  if (!tarBuffer) {
    log('请等待 TAR 下载完成', 'error');
    return;
  }

  log('创建 FastImageSequence（TAR + 无目录前缀 frameN.jpg）...');

  try {
    const seq = new window['fast-image-sequence'].FastImageSequence(container, {
      frames: 71,
      src: {
        tarURL: TAR_URL,
        imageURL: (i) => `frame${i + 1}.jpg`,
      },
      loop: true,
      objectFit: 'contain',
      showDebugInfo: true,
      clearCanvas: true,
    });

    log('等待 seq.ready...');
    await seq.ready;
    log('FastImageSequence 就绪！', 'ok');
    seq.progress = 0.5;
  } catch (err) {
    log(`FIS 错误: ${err.message}`, 'error');
    console.error(err);
  }
}

// ==================== 步骤3c：手动提取单个帧 ====================
async function testManual() {
  logEl.textContent = '';

  if (!tarBuffer) {
    log('请等待 TAR 下载完成', 'error');
    return;
  }

  log('手动解析 TAR 并提取 frame1.jpg...');

  const tarball = createTarballFromBuffer(tarBuffer);
  tarball.init();

  const testPaths = ['customize/frame1.jpg', 'frame1.jpg', 'customize/frame44.jpg', 'frame44.jpg'];
  for (const path of testPaths) {
    const info = tarball.getInfo(path);
    if (info) {
      log(`✓ 找到: "${info.name}" (通过 "${path}")`, 'ok');
    } else {
      log(`✗ 未找到: "${path}"`, 'error');
    }
  }

  // 尝试提取 customize/frame1.jpg
  const info = tarball.getInfo('customize/frame1.jpg');
  if (info) {
    log(`尝试提取: "${info.name}"...`);
    try {
      const blob = tarball.getBlob('customize/frame1.jpg');
      const bitmap = await createImageBitmap(blob);
      log(`提取成功! ${bitmap.width}x${bitmap.height}`, 'ok');

      // 显示到 canvas
      const container = document.getElementById('fis-container');
      container.innerHTML = '';
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.objectFit = 'contain';
      container.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0);
      log('手动渲染成功！', 'ok');
    } catch (err) {
      log(`提取失败: ${err.message}`, 'error');
    }
  } else {
    log('无法提取 customize/frame1.jpg - 文件中不存在', 'error');
  }
}

// ==================== 启动：先下载 TAR ====================
downloadAndParse();
</script>

<script src="/fast-image-sequence.umd.cjs"></script>
</body>
</html>
